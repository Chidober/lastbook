# Prefer the interactive wizard:
#   bash docker/deploy.sh
#
# Or non-interactive:
#   cp docker/lmstudio.env.sample docker/lmstudio.env  # edit
#   docker compose -f docker/compose.yml --env-file docker/lmstudio.env up -d --build
services:
  lastbook:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: lastbook-server:local
    container_name: lastbook
    restart: unless-stopped
    network_mode: host
    environment:
      LASTBOOK_DATA: /data/LastbookData
      XDG_CONFIG_HOME: /data/config
      PORT: ${LASTBOOK_PORT:-8890}
      MODEL_PROXY_PORT: "19443"
      SURVIVAL_MODEL_BASE: http://127.0.0.1:19443
      LMSTUDIO_URL: ${LMSTUDIO_URL:?set LMSTUDIO_URL}
      LMSTUDIO_TOKEN: ${LMSTUDIO_TOKEN:?set LMSTUDIO_TOKEN}
      SURVIVAL_MODEL: ${SURVIVAL_MODEL:?set SURVIVAL_MODEL}
      SURVIVAL_REASONING_EFFORT: ${SURVIVAL_REASONING_EFFORT:-none}
      LASTBOOK_LAN: ${LASTBOOK_LAN:-0}
    volumes:
      # Mount the parent, not LastbookData itself. Setup downloads into
      # /data/LastbookData.setup and renames that folder into /data/LastbookData.
      # A mount point cannot be renamed, which leaves the host folder nearly empty.
      - ${LASTBOOK_HOST_ROOT:?set LASTBOOK_HOST_ROOT}:/data
